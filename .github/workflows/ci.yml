name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: guardrail
          POSTGRES_PASSWORD: guardrail
          POSTGRES_DB: guardrail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U guardrail"
          --health-interval 2s --health-timeout 3s --health-retries 30
      # KMS-compatible endpoint for the KMS signer backend tests.
      kms:
        image: nsmithuk/local-kms:3.12.0@sha256:7c987f75e10d775630117293f86d09666169d0416e442244e55f816a002e0e77
        env:
          KMS_REGION: us-east-1
          KMS_ACCOUNT_ID: "111122223333"
        ports: ["8090:8080"]
    env:
      DATABASE_URL: postgres://guardrail:guardrail@localhost:5432/guardrail
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved to malicious code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # Local EVM chain for the signer and end-to-end tests (image pinned by digest).
      - name: Start anvil
        run: |
          docker run -d --name anvil -p 8545:8545 --entrypoint anvil \
            ghcr.io/foundry-rs/foundry:v1.4.3@sha256:409c397a8d9675d8c911e564727b959d0c76e5efb3193f512a69bf8b89a7f85f \
            --host 0.0.0.0 --chain-id 31337
          for i in $(seq 1 30); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8545 && break
            sleep 1
          done
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
